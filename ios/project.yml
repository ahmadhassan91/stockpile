name: StockpileCaptureApp
options:
  minimumXcodeGenVersion: 2.39.0
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.10"
    PRODUCT_NAME: Stockpile Capture
    STOCKPILE_PRODUCT_BUNDLE_IDENTIFIER: com.clustox.stockpile.capture
    PRODUCT_BUNDLE_IDENTIFIER: $(STOCKPILE_PRODUCT_BUNDLE_IDENTIFIER)
    # Keep signing automatic and repo-safe. Inject a real team locally or in CI before
    # archiving for TestFlight; do not commit team IDs or provisioning secrets here.
    STOCKPILE_DEVELOPMENT_TEAM: "4ZRQ8D9UFG"
    DEVELOPMENT_TEAM: $(STOCKPILE_DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    VERSIONING_SYSTEM: apple-generic
    STOCKPILE_BUILD_NUMBER: 2026051201
    CURRENT_PROJECT_VERSION: "$(STOCKPILE_BUILD_NUMBER)"
    STOCKPILE_MARKETING_VERSION: 0.1.0
    MARKETING_VERSION: $(STOCKPILE_MARKETING_VERSION)
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Stockpile Capture
    # Revisit this only if the shipped alpha adds custom/non-exempt crypto beyond
    # standard Apple platform networking and transport security.
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Stockpile Capture uses location to tag capture sessions to the correct site.
    INFOPLIST_KEY_NSCameraUsageDescription: Stockpile Capture records guided stockpile walkarounds for measurement processing.
    INFOPLIST_KEY_NSMotionUsageDescription: Stockpile Capture uses motion sensors to check capture stability and guide the stockpile walkaround.
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Stockpile Capture can export review snapshots to your photo library.
    SUPPORTS_MACCATALYST: NO
    TARGETED_DEVICE_FAMILY: "1"
packages:
  StockpileCaptureKit:
    path: StockpileCaptureKit
targets:
  StockpileCaptureApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StockpileCaptureApp/Sources
      - path: StockpileCaptureApp/Resources
        buildPhase: resources
    dependencies:
      - package: StockpileCaptureKit
        product: StockpileAppShell
      - package: StockpileCaptureKit
        product: StockpileMobileAPI
      - package: StockpileCaptureKit
        product: StockpileCameraCapture
      - package: StockpileCaptureKit
        product: StockpileUploadPipeline
      - package: StockpileCaptureKit
        product: StockpileProcessingRuntime
      - package: StockpileCaptureKit
        product: StockpileCaptureFlow
      - package: StockpileCaptureKit
        product: StockpileMobileFirstCapture
      - package: StockpileCaptureKit
        product: StockpileResultsUI
      - package: StockpileCaptureKit
        product: StockpileDesignSystem
      - package: StockpileCaptureKit
        product: StockpileOperatorDashboard
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        STOCKPILE_ENVIRONMENT: Staging
        STOCKPILE_API_BASE_URL: https://stockpile.theclustox.com/api/mobile
        STOCKPILE_CAPTURE_BUNDLE_SUBMISSION_URL: https://stockpile.theclustox.com/api/v2/captures
        STOCKPILE_LAUNCH_MODE: operational
        STOCKPILE_USE_LIVE_CAMERA: YES
        STOCKPILE_USE_MOCK_RESULTS: NO
        STOCKPILE_ENABLE_BACKUP_VIDEO_IMPORT: NO
        STOCKPILE_ENABLE_CONFIGURED_FALLBACK_CAPTURE: NO
        STOCKPILE_ENABLE_LIDAR_ASSIST: YES
        STOCKPILE_API_TIMEOUT_SECONDS: 30
        STOCKPILE_PROCESSING_POLL_INTERVAL_MS: 2000
        STOCKPILE_UPLOAD_BACKGROUND_SESSION_ID: com.clustox.stockpile.capture.upload.debug
        STOCKPILE_API_BEARER_TOKEN: ""
        STOCKPILE_API_AUTH_HEADER_NAME: ""
        STOCKPILE_API_AUTH_HEADER_VALUE: ""
        INFOPLIST_KEY_STOCKPILE_ENVIRONMENT: $(STOCKPILE_ENVIRONMENT)
        INFOPLIST_KEY_STOCKPILE_API_BASE_URL: $(STOCKPILE_API_BASE_URL)
        INFOPLIST_KEY_STOCKPILE_CAPTURE_BUNDLE_SUBMISSION_URL: $(STOCKPILE_CAPTURE_BUNDLE_SUBMISSION_URL)
        INFOPLIST_KEY_STOCKPILE_LAUNCH_MODE: $(STOCKPILE_LAUNCH_MODE)
        INFOPLIST_KEY_STOCKPILE_USE_LIVE_CAMERA: $(STOCKPILE_USE_LIVE_CAMERA)
        INFOPLIST_KEY_STOCKPILE_USE_MOCK_RESULTS: $(STOCKPILE_USE_MOCK_RESULTS)
        INFOPLIST_KEY_STOCKPILE_ENABLE_BACKUP_VIDEO_IMPORT: $(STOCKPILE_ENABLE_BACKUP_VIDEO_IMPORT)
        INFOPLIST_KEY_STOCKPILE_ENABLE_CONFIGURED_FALLBACK_CAPTURE: $(STOCKPILE_ENABLE_CONFIGURED_FALLBACK_CAPTURE)
        INFOPLIST_KEY_STOCKPILE_ENABLE_LIDAR_ASSIST: $(STOCKPILE_ENABLE_LIDAR_ASSIST)
        INFOPLIST_KEY_STOCKPILE_API_TIMEOUT_SECONDS: $(STOCKPILE_API_TIMEOUT_SECONDS)
        INFOPLIST_KEY_STOCKPILE_PROCESSING_POLL_INTERVAL_MS: $(STOCKPILE_PROCESSING_POLL_INTERVAL_MS)
        INFOPLIST_KEY_STOCKPILE_UPLOAD_BACKGROUND_SESSION_ID: $(STOCKPILE_UPLOAD_BACKGROUND_SESSION_ID)
        INFOPLIST_KEY_STOCKPILE_API_BEARER_TOKEN: $(STOCKPILE_API_BEARER_TOKEN)
        INFOPLIST_KEY_STOCKPILE_API_AUTH_HEADER_NAME: $(STOCKPILE_API_AUTH_HEADER_NAME)
        INFOPLIST_KEY_STOCKPILE_API_AUTH_HEADER_VALUE: $(STOCKPILE_API_AUTH_HEADER_VALUE)
        # Uncomment an entitlements file here only when the matching Apple Developer
        # capability and runtime wiring are both in place.
        # CODE_SIGN_ENTITLEMENTS: StockpileCaptureApp/StockpileCaptureApp.entitlements
        INFOPLIST_KEY_CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.clustox.stockpile.capture
            CFBundleURLSchemes:
              - stockpile-capture
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
      configs:
        Debug:
          STOCKPILE_ENVIRONMENT: Staging
          STOCKPILE_API_BASE_URL: https://stockpile.theclustox.com/api/mobile
          STOCKPILE_CAPTURE_BUNDLE_SUBMISSION_URL: https://stockpile.theclustox.com/api/v2/captures
          STOCKPILE_UPLOAD_BACKGROUND_SESSION_ID: com.clustox.stockpile.capture.upload.debug
        Release:
          STOCKPILE_ENVIRONMENT: Staging
          STOCKPILE_API_BASE_URL: https://stockpile.theclustox.com/api/mobile
          STOCKPILE_CAPTURE_BUNDLE_SUBMISSION_URL: https://stockpile.theclustox.com/api/v2/captures
          STOCKPILE_API_TIMEOUT_SECONDS: 45
          STOCKPILE_UPLOAD_BACKGROUND_SESSION_ID: com.clustox.stockpile.capture.upload
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_COMPILATION_MODE: wholemodule
          STRIP_INSTALLED_PRODUCT: YES
          VALIDATE_PRODUCT: YES
          COPY_PHASE_STRIP: YES
          ENABLE_NS_ASSERTIONS: NO
          # Add release-only capabilities back deliberately as the alpha grows.
          # Keep the initial distributable profile minimal until push/background
          # processing are implemented end-to-end.
schemes:
  StockpileCaptureApp:
    build:
      targets:
        StockpileCaptureApp: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
