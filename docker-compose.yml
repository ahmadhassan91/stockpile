services:
  stockpile:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockpile-app
    ports:
      - "8501:8501"
    volumes:
      - stockpile-data:/app/data
    restart: unless-stopped
    environment:
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=500

volumes:
  stockpile-data:
