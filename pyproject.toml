[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockpile"
version = "0.1.0"
description = "Estimate stockpile weight from ground-level walkaround video"
requires-python = ">=3.10"
dependencies = [
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "open3d>=0.18",
    "streamlit>=1.30",
    "plotly>=5.18",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["stockpile*"]
