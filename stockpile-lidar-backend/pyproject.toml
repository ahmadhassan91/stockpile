[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockpile-lidar-backend"
version = "0.1.0"
description = "Lean LiDAR capture backend skeleton for Stockpile mobile calibration readiness"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "open3d>=0.18",
    "Pillow>=10.0",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "scipy>=1.12",
    "uvicorn[standard]>=0.24",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["stockpile_lidar*"]
